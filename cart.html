<!-- =========================================================
     SHARED CART
========================================================= -->

<div class="cart-overlay"
     id="cartOverlay">
</div>


<aside class="cart-drawer"
       id="cartDrawer"
       aria-label="Shopping cart">

    <div class="cart-header">

        <h2>
            Your Collection
        </h2>

        <button
            class="cart-close"
            id="cartClose"
            type="button"
            aria-label="Close cart">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>


    <div class="cart-body"
         id="cartBody">
    </div>


    <div class="cart-footer"
         id="cartFooter">

        <div class="cart-summary">

            <span>
                Items
            </span>

            <strong id="cartTotalItems">
                0
            </strong>

        </div>


        <button
            class="cart-whatsapp"
            id="cartWhatsapp"
            type="button">

            <i class="fa-brands fa-whatsapp"></i>

            Enquire About Cart

        </button>


        <button
            class="cart-clear"
            id="cartClear"
            type="button">

            Clear Cart

        </button>

    </div>

</aside>
